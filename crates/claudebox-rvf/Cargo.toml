[package]
name = "claudebox-rvf"
version = "0.1.8"
edition = "2021"

[features]
default = []
advanced-ebpf = ["dep:claudebox-ebpf"]

[dependencies]
claudebox-core = { path = "../claudebox-core" }
claudebox-witness = { path = "../claudebox-witness" }
claudebox-ebpf = { path = "../claudebox-ebpf", optional = true }
rvf-runtime = { workspace = true }
rvf-crypto = { workspace = true }
rvf-types = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
sha3 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
dirs = { workspace = true }

[dev-dependencies]
tempfile = "3"
