[package]
name = "claudebox-cli"
version = "0.1.5"
edition = "2021"

[[bin]]
name = "claudebox"
path = "src/main.rs"

[dependencies]
claudebox-core = { path = "../claudebox-core" }
claudebox-rvf = { path = "../claudebox-rvf" }
claudebox-firecracker = { path = "../claudebox-firecracker" }
claudebox-vec = { path = "../claudebox-vec" }
claudebox-witness = { path = "../claudebox-witness" }
claudebox-meta = { path = "../claudebox-meta" }
claudebox-migrate = { path = "../claudebox-migrate" }
clap = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = "3"
chrono = { workspace = true }
rvf-runtime = { workspace = true }

[[test]]
name = "test_init"
path = "tests/integration/test_init.rs"

[[test]]
name = "test_witness"
path = "tests/integration/test_witness.rs"

[[test]]
name = "test_vec"
path = "tests/integration/test_vec.rs"

[[test]]
name = "test_boot"
path = "tests/integration/test_boot.rs"

[[test]]
name = "test_kernel"
path = "tests/integration/test_kernel.rs"

[[test]]
name = "test_snapshot"
path = "tests/integration/test_snapshot.rs"

[[test]]
name = "test_e2e_sidecars"
path = "tests/integration/test_e2e_sidecars.rs"

[[test]]
name = "test_rvf_fixtures"
path = "tests/integration/test_rvf_fixtures.rs"
