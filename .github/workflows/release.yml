name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: claudebox-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: claudebox-x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: claudebox-x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y ca-certificates

      - name: Build
        run: |
          cargo build --release --target "${{ matrix.target }}" -p claudebox-cli
          cp "target/${{ matrix.target }}/release/claudebox" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten dist directory
        run: |
          find dist/ -type f -exec mv {} dist/ \;
          find dist/ -type d -empty -delete
          ls -lh dist/

      - name: Bundle assets, checksums, and upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "claudebox $TAG" --notes "Automated release for $TAG"
          fi

          if [ -f kernels/bzImage ]; then
            cp kernels/bzImage dist/bzImage-x86_64
          fi

          (
            cd dist
            sha256sum * > SHA256SUMS.txt
          )

          gh release upload "$TAG" dist/* --clobber

      - name: Update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release edit "$TAG" --notes "## claudebox ${TAG}

          ### Install
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/dgdev25/claudebox/main/install.sh | bash
          claudebox setup
          \`\`\`

          ### Binaries
          | Platform | File |
          |----------|------|
          | macOS Apple Silicon | \`claudebox-aarch64-apple-darwin\` |
          | macOS Intel | \`claudebox-x86_64-apple-darwin\` |
          | Linux x86_64 | \`claudebox-x86_64-unknown-linux-gnu\` |

          ### Assets
          - \`claudebox-dev-${VERSION}.qcow2\` — Alpine 3.21 dev image (Node 22, Python 3.12, git, gcc)
          - \`bzImage-x86_64\` — Linux 6.6.80 kernel"
